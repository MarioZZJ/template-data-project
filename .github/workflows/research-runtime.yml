name: Research runtime
on:
  pull_request:
    paths:
      - scripts/research.py
      - tests/test_research*.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/research-runtime.yml
  workflow_dispatch:
jobs:
  portable-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test paths, snapshots, isolation, delivery and platform commands
        run: python -m unittest discover -s tests -p "test_research*.py" -v
      # Native supervisors require a logged-in OS user/session. Portable tests do not certify those.
